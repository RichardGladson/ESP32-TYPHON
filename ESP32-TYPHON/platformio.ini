; PlatformIO Project for ESP32 TYPHON
; Target: ESP32-WROOM + ST7735 1.8" 160x128 + HW-504 Joystick
; Features: Wi-Fi + BLE tools only (UI-focused port)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^1.4.2

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D ST7735_BLACKTAB=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=17
    -D TFT_BL=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=0
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_MODE=0
    -D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
    -Wl,--wrap=ieee80211_raw_frame_sanity_check

board_build.partitions = default.csv
board_build.f_cpu = 240000000L
